    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "diff",
        "alternateName": "diff.achraf.tn",
        "url": "https://diff.achraf.tn/",
        "description": "A fast, private text diff that runs entirely in your browser.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Achraf Ben Abdallah", "url": "https://achraf.tn" }
      }
    </script>
    <script>
      // Applies the saved theme before first paint. Keep the "theme" key in sync with src/lib/theme.ts.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
