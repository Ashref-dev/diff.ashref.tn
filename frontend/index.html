<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>diff.ashref.tn</title>
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://diff.ashref.tn/" />
    <meta
      name="description"
      content="Compare text instantly with a real-time split-view diff tool. Line, word, and character-level comparison with syntax highlighting."
    />
    <meta name="theme-color" content="#070a14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f9ff" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="diff.ashref.tn — Compare text, instantly." />
    <meta
      property="og:description"
      content="Real-time split-view text diff with syntax highlighting. No clicks needed."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="diff.ashref.tn" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://diff.ashref.tn" />
    <meta property="og:image" content="https://diff.ashref.tn/favicon.svg" />
    <meta
      property="og:image:alt"
      content="diff.ashref.tn — Real-time split-view text diff tool with syntax highlighting"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="diff.ashref.tn" />
    <meta
      name="twitter:description"
      content="Real-time split-view text diff with syntax highlighting."
    />
    <meta name="twitter:image" content="https://diff.ashref.tn/og.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const stored = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const mode = stored || 'system';
        const active = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
        document.documentElement.setAttribute('data-theme', active);
      })();
    </script>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div class="ambient-orb orb-top" aria-hidden="true"></div>
    <div class="ambient-orb orb-bottom" aria-hidden="true"></div>

    <header class="site-header" id="siteHeader">
      <div class="container header-inner">
        <a class="brand" href="/">
          <span class="brand-dot" aria-hidden="true"></span>
          <span class="brand-text">diff.ashref.tn</span>
        </a>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
          <span class="theme-toggle-icon" aria-hidden="true">◐</span>
          <span class="theme-toggle-label" id="themeToggleLabel">System</span>
        </button>
      </div>
    </header>

    <main class="container main-content">
      <section class="hero">
        <p class="eyebrow">TEXT DIFF TOOL</p>
        <h1>Compare text, <span class="serif">instantly.</span></h1>
        <p class="hero-description">
          Paste or type two texts and see differences highlighted in real time. No clicks needed.
        </p>
        <div class="hero-meta">
          <span>Real-time</span>
          <span>Split view</span>
          <span>Syntax highlight</span>
        </div>
      </section>
    </main>

    <section class="workspace" id="workspace">
        <div class="stats-bar" id="statsBar">
          <span class="stat stat-add" id="statAdd">0 additions</span>
          <span class="stat stat-remove" id="statRemove">0 deletions</span>
          <span class="stat stat-context" id="statContext">0 unchanged</span>
          <button class="clear-btn" id="clearBtn" type="button">Clear</button>
          <span class="shortcut-hint">⌘ Enter to swap</span>
        </div>

        <div class="workspace-layout">
          <aside class="sidebar" id="sidebar">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" type="button">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M15 18l-6-6 6-6" />
              </svg>
            </button>
            <div class="sidebar-content">
              <h3 class="sidebar-title">Options</h3>

              <div class="control-group">
                <label class="control-label">Diff precision</label>
                <div class="segmented" id="diffPrecision">
                  <button class="seg-btn active" type="button" data-value="line">Line</button>
                  <button class="seg-btn" type="button" data-value="word">Word</button>
                  <button class="seg-btn" type="button" data-value="char">Char</button>
                </div>
              </div>

              <div class="control-group">
                <label class="control-label">Case sensitive</label>
                <label class="toggle">
                  <input type="checkbox" id="caseSensitive" checked />
                  <span class="toggle-slider"></span>
                </label>
              </div>

              <div class="control-group">
                <label class="control-label">Trim whitespace</label>
                <label class="toggle">
                  <input type="checkbox" id="trimWhitespace" />
                  <span class="toggle-slider"></span>
                </label>
              </div>

              <div class="control-group">
                <label class="control-label">Line wrap</label>
                <label class="toggle">
                  <input type="checkbox" id="lineWrap" checked />
                  <span class="toggle-slider"></span>
                </label>
              </div>

              <div class="control-group">
                <label class="control-label">Transform text</label>
                <div class="segmented" id="textTransform">
                  <button class="seg-btn active" type="button" data-value="none">None</button>
                  <button class="seg-btn" type="button" data-value="lower">a→z</button>
                  <button class="seg-btn" type="button" data-value="upper">A→Z</button>
                </div>
              </div>

              <div class="control-group">
                <label class="control-label" for="syntaxLang">Syntax highlight</label>
                <select class="select-input" id="syntaxLang">
                  <option value="">None</option>
                  <option value="javascript">JavaScript</option>
                  <option value="typescript">TypeScript</option>
                  <option value="python">Python</option>
                  <option value="go">Go</option>
                  <option value="c">C</option>
                  <option value="cpp">C++</option>
                  <option value="csharp">C#</option>
                  <option value="java">Java</option>
                  <option value="rust">Rust</option>
                  <option value="ruby">Ruby</option>
                  <option value="php">PHP</option>
                  <option value="html">HTML</option>
                  <option value="css">CSS</option>
                  <option value="sql">SQL</option>
                  <option value="bash">Bash</option>
                  <option value="json">JSON</option>
                  <option value="yaml">YAML</option>
                  <option value="markdown">Markdown</option>
                </select>
              </div>
            </div>
          </aside>

          <div class="editors" id="editors">
            <div class="editor-panel">
              <div class="editor-header">
                <span class="editor-label">Original</span>
                <span class="editor-line-count" id="originalLineCount">0 lines</span>
              </div>
              <div class="editor-surface">
                <div class="diff-display" id="originalDisplay"></div>
                <textarea
                  class="editor-input"
                  id="originalInput"
                  placeholder="Paste or type original text..."
                  spellcheck="false"
                ></textarea>
              </div>
            </div>
            <div class="editor-divider"></div>
            <div class="editor-panel">
              <div class="editor-header">
                <span class="editor-label">Modified</span>
                <span class="editor-line-count" id="modifiedLineCount">0 lines</span>
              </div>
              <div class="editor-surface">
                <div class="diff-display" id="modifiedDisplay"></div>
                <textarea
                  class="editor-input"
                  id="modifiedInput"
                  placeholder="Paste or type modified text..."
                  spellcheck="false"
                ></textarea>
              </div>
            </div>
          </div>
        </div>
      </section>

    <footer class="site-footer">
      <div class="container">
        <p>
          Made by
          <a href="https://ashref.tn" target="_blank" rel="noopener">ashref.tn</a>
        </p>
      </div>
    </footer>

    <noscript>
      <div style="padding:2rem;text-align:center;color:#f6f4ff;font-family:Inter,sans-serif;">
        JavaScript is required for the diff tool to work.
      </div>
    </noscript>
  </body>
</html>
