<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#281e0a" flood-opacity="0.16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0.05 0"/>
    </filter>
    <path id="sheet" d="M80 321 A11 11 0 0 1 91 310 L227 310 A11 11 0 0 1 238 321 L238 340 A10 10 0 0 0 248 350 L1096 350 A24 24 0 0 1 1120 374 L1120 532 A24 24 0 0 1 1096 556 L104 556 A24 24 0 0 1 80 532 Z"/>
    <clipPath id="card"><use href="#sheet"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#f5f4f0"/>
  <rect width="1200" height="630" filter="url(#grain)"/>

  <text x="80" y="104" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="44" fill="#1b1a17">diff<tspan font-family="Inter, system-ui, sans-serif" font-style="normal" font-size="24" font-weight="500" fill="#57534b">.achraf.tn</tspan></text>

  <text font-family="'Instrument Serif', Georgia, serif" font-size="84" fill="#1b1a17" letter-spacing="-1.5">
    <tspan x="80" y="224">Two texts in, <tspan font-style="italic" fill="#a14c00">every change</tspan> out.</tspan>
  </text>
  <text x="82" y="274" font-family="Inter, system-ui, sans-serif" font-size="24" fill="#57534b">Split or unified · word-level highlights · runs entirely in your browser</text>

  <g filter="url(#shadow)">
    <use href="#sheet" fill="#fdfdfb" stroke="#e3e2dd" stroke-width="2"/>
  </g>
  <g clip-path="url(#card)" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="22">
    <text x="100" y="340" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="26" fill="#1b1a17">Diff</text>
    <text x="150" y="339" font-size="17" font-weight="600" fill="#17693b">+1</text>
    <text x="184" y="339" font-size="17" font-weight="600" fill="#b12a47">−1</text>

    <text x="120" y="404" fill="#6f6a61" text-anchor="end">13</text>
    <text x="186" y="404" fill="#1b1a17">return {</text>

    <rect x="80" y="416" width="1040" height="40" fill="#f8e6e8"/>
    <rect x="80" y="416" width="56" height="40" fill="#f4d9dd"/>
    <rect x="356" y="422" width="57" height="28" rx="5" fill="#efc2ca"/>
    <text x="120" y="444" fill="#b12a47" text-anchor="end">14</text>
    <text x="148" y="444" fill="#b12a47">-</text>
    <text x="213" y="444" fill="#1b1a17">name: user.name,</text>

    <rect x="80" y="456" width="1040" height="40" fill="#e3f2e8"/>
    <rect x="80" y="456" width="56" height="40" fill="#d3ebdc"/>
    <rect x="356" y="462" width="149" height="28" rx="5" fill="#b9e0c6"/>
    <text x="120" y="484" fill="#17693b" text-anchor="end">14</text>
    <text x="148" y="484" fill="#17693b">+</text>
    <text x="213" y="484" fill="#1b1a17">name: user.displayName,</text>

    <text x="120" y="524" fill="#6f6a61" text-anchor="end">15</text>
    <text x="213" y="524" fill="#1b1a17">email: user.email,</text>
  </g>

  <text x="1120" y="596" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#6f6a61">Made by <tspan font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="24" fill="#1b1a17">achraf.tn</tspan></text>
</svg>
